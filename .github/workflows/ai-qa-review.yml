name: AI Mobile QA Review

# End-to-end automated flow:
#   1. Claude reviews the PR diff and posts a review comment.
#   2. If Claude flagged any missing tests, OpenAI generates Kotlin test files.
#   3. We run ./gradlew testDebugUnitTest to verify the generated tests pass.
#   4. If they fail, the bot asks the generator to regenerate / fix them and
#      re-runs the suite. This repeats up to MAX_FIX_ATTEMPTS times
#      (configurable via the `MAX_FIX_ATTEMPTS` repo/org variable, default 2).
#   5. The bot then commits the generated tests to the PR's source branch
#      regardless of whether the final test run passed — the AI's work is
#      preserved on the PR, and a status comment is posted explaining the
#      final outcome (pass after N fixes, or still failing after MAX retries).
#   6. UI tests are NOT booted here (an emulator would add ~5-10 min per PR).
#      They are verified separately by android-ci.yml's instrumented-tests job
#      against the bot's commit. If a generated UI test is broken, you'll see
#      a red Compose UI check on the auto-commit and can revert it.
#
# Loop prevention: this workflow skips itself when the latest commit was made
# by github-actions[bot] (i.e., our own auto-commit). Without this guard,
# every auto-commit would re-trigger the workflow and burn LLM tokens.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review-and-generate:
    name: Review + auto-generate + verify + commit
    runs-on: ubuntu-latest
    # Skip on bot's own commits so we don't recurse
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write
      pull-requests: write

    env:
      # Number of times the bot will ask the generator to fix failing unit
      # tests before committing anyway. Override by creating a repo or org
      # variable named MAX_FIX_ATTEMPTS.
      MAX_FIX_ATTEMPTS: ${{ vars.MAX_FIX_ATTEMPTS || '2' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR's source branch (not the merge commit) so we
          # can push the bot's commit back to it.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mobile-qa-agent/requirements.txt

      - name: Install agent dependencies
        run: pip install -r mobile-qa-agent/requirements.txt

      # ----------------------------------------------------------------------
      # 1. Reviewer (Claude / OpenAI / Bedrock — picked via PROVIDER)
      # ----------------------------------------------------------------------
      - name: Run AI QA reviewer
        id: review
        working-directory: mobile-qa-agent
        env:
          PROVIDER:           ${{ vars.PROVIDER || 'anthropic' }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:    ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:       ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          AWS_ACCESS_KEY_ID:  ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:         ${{ vars.AWS_REGION || 'us-east-1' }}
          BEDROCK_MODEL_ID:   ${{ vars.BEDROCK_MODEL_ID || 'us.amazon.nova-pro-v1:0' }}

          # LangSmith observability — only active when the API key secret is set.
          LANGSMITH_API_KEY:  ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING:  ${{ secrets.LANGSMITH_API_KEY && 'true' || 'false' }}
          LANGSMITH_PROJECT:  ${{ vars.LANGSMITH_PROJECT || 'mobile-qa-agent' }}
        run: |
          mkdir -p artifacts
          python main.py --save-findings artifacts/findings.json

          # Determine whether any test gaps were found.
          HAS=$(python -c "
          import json
          d = json.load(open('artifacts/findings.json'))
          gaps = (d.get('missing_unit_tests') or []) + (d.get('missing_ui_tests') or [])
          print('true' if gaps else 'false')
          ")
          echo "has-findings=$HAS" >> "$GITHUB_OUTPUT"
          echo "Findings present: $HAS"

      # ----------------------------------------------------------------------
      # 2. Generator (OpenAI) — only if Claude found gaps
      # ----------------------------------------------------------------------
      - name: Generate Kotlin test files
        if: steps.review.outputs.has-findings == 'true'
        working-directory: mobile-qa-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:   ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY && 'true' || 'false' }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'mobile-qa-agent' }}
        run: |
          python generate_tests.py \
            --findings-file artifacts/findings.json \
            --max 5

      - name: Show newly generated files
        if: steps.review.outputs.has-findings == 'true'
        run: |
          echo "=== Generated test files ==="
          git status --short -- android/app/src/test/ android/app/src/androidTest/ || true

      # ----------------------------------------------------------------------
      # 3. Verify the generated tests with gradle, with an AI fix-retry loop
      # ----------------------------------------------------------------------
      - name: Set up JDK 17
        if: steps.review.outputs.has-findings == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Gradle (for bootstrapping the wrapper)
        if: steps.review.outputs.has-findings == 'true'
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Bootstrap Gradle wrapper
        if: steps.review.outputs.has-findings == 'true'
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew

      # Runs ./gradlew testDebugUnitTest. If it fails, asks the generator to
      # regenerate / fix the test files (with --overwrite) and retries, up to
      # MAX_FIX_ATTEMPTS times. The step itself always exits 0 — the final
      # status is reported via outputs so we can both commit the bot's work
      # AND leave an honest status comment on the PR.
      - name: Run unit tests with AI fix-retry loop
        if: steps.review.outputs.has-findings == 'true'
        id: unit_tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:   ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY && 'true' || 'false' }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'mobile-qa-agent' }}
        run: |
          set +e
          max="${MAX_FIX_ATTEMPTS:-2}"
          echo "Max AI fix attempts after initial failure: $max"

          # Initial test run
          pushd android > /dev/null
          ./gradlew testDebugUnitTest --stacktrace
          status=$?
          popd > /dev/null

          attempt=0
          while [ "$status" -ne 0 ] && [ "$attempt" -lt "$max" ]; do
            attempt=$((attempt + 1))
            echo "::group::AI fix attempt $attempt of $max"
            pushd mobile-qa-agent > /dev/null
            # --overwrite lets the generator replace the failing files we just wrote.
            python generate_tests.py \
              --findings-file artifacts/findings.json \
              --max 5 \
              --overwrite || true
            popd > /dev/null

            pushd android > /dev/null
            ./gradlew testDebugUnitTest --stacktrace
            status=$?
            popd > /dev/null
            echo "::endgroup::"
          done

          echo "fix_attempts=$attempt" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "tests_passed=true"  >> "$GITHUB_OUTPUT"
            echo "Unit tests passed after $attempt fix attempt(s)."
          else
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "Unit tests still failing after $attempt fix attempt(s). Committing anyway."
          fi
          # Never fail the step — we want to commit and comment regardless.
          exit 0

      # UI tests are NOT booted here — booting an emulator inside this workflow
      # would add ~5-10 min per PR. Instead we rely on android-ci.yml's
      # `instrumented-tests` job (which uses AVD caching) to verify the
      # generated UI tests on the bot's commit. If the UI test the AI wrote
      # turns out to be broken, you'll see a red Compose UI check on the
      # bot's commit and can revert it.

      # ----------------------------------------------------------------------
      # 4. Always commit the generated tests to the PR branch, even if the
      #    unit tests are still failing after MAX_FIX_ATTEMPTS retries. The
      #    PR comment below makes the final outcome explicit.
      # ----------------------------------------------------------------------
      - name: Commit generated tests to the PR branch
        if: steps.review.outputs.has-findings == 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"

          # Stage the test directories (never production code) and the
          # auto-generated USAGE.md cost summary. USAGE.md gets refreshed by
          # main.py / generate_tests.py at the end of each run.
          git add -A android/app/src/test/ android/app/src/androidTest/
          if [ -f mobile-qa-agent/USAGE.md ]; then
            git add mobile-qa-agent/USAGE.md
          fi

          if git diff --staged --quiet; then
            echo "No new test files to commit."
            exit 0
          fi

          PASSED="${{ steps.unit_tests.outputs.tests_passed }}"
          ATTEMPTS="${{ steps.unit_tests.outputs.fix_attempts }}"

          if [ "$PASSED" = "true" ]; then
            MSG="🤖 AI-generated tests for missing coverage

          Generated by the AI Mobile QA Review workflow after Claude flagged
          missing test coverage. Verified by ./gradlew testDebugUnitTest on CI
          (fix attempts: ${ATTEMPTS})."
          else
            MSG="🤖 AI-generated tests for missing coverage (unit tests still failing)

          Generated by the AI Mobile QA Review workflow after Claude flagged
          missing test coverage. The bot retried ${ATTEMPTS} time(s) via the
          generator and ./gradlew testDebugUnitTest is still failing. Committing
          anyway so the work-in-progress is visible on the PR — please review."
          fi

          git commit -m "$MSG"

          # Retry the push to absorb transient GitHub 5xx errors (we've seen
          # the API return 500 "Internal Server Error" on otherwise valid
          # pushes). Bounded: up to 5 attempts with linear backoff.
          PUSH_MAX_ATTEMPTS=5
          PUSH_BACKOFF_SECS=5
          attempt=0
          until git push origin "HEAD:${{ github.event.pull_request.head.ref }}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$PUSH_MAX_ATTEMPTS" ]; then
              echo "::error::git push failed after $PUSH_MAX_ATTEMPTS attempts"
              exit 1
            fi
            wait_for=$((PUSH_BACKOFF_SECS * attempt))
            echo "::warning::git push attempt $attempt failed; retrying in ${wait_for}s..."
            sleep "$wait_for"
          done

      # ----------------------------------------------------------------------
      # 5. Post a status comment on the PR with the final outcome
      # ----------------------------------------------------------------------
      - name: Comment on PR with test outcome
        if: steps.review.outputs.has-findings == 'true'
        uses: actions/github-script@v7
        env:
          TESTS_PASSED:     ${{ steps.unit_tests.outputs.tests_passed }}
          FIX_ATTEMPTS:     ${{ steps.unit_tests.outputs.fix_attempts }}
          MAX_FIX_ATTEMPTS: ${{ env.MAX_FIX_ATTEMPTS }}
        with:
          script: |
            const fs = require('fs');
            const passed = process.env.TESTS_PASSED === 'true';
            const attempts = process.env.FIX_ATTEMPTS || '0';
            const max = process.env.MAX_FIX_ATTEMPTS || '2';

            // Load this run's LLM cost summary (written by usage_tracker.write_run_cost()).
            // Falls back to a quiet "—" line if the file is missing.
            let costLine = '';
            try {
              const raw = fs.readFileSync('mobile-qa-agent/artifacts/run_cost.json', 'utf8');
              const run = JSON.parse(raw);
              const total = run.total || { calls: 0, cost_usd: 0,
                                            input_tokens: 0, output_tokens: 0 };
              const byProv = Object.entries(run.by_provider || {})
                .map(([p, b]) => `${p} $${Number(b.cost_usd).toFixed(4)}`)
                .join(', ') || 'none';
              costLine =
                `\n---\n` +
                `**LLM usage this run:** ${total.calls} call(s), ` +
                `${Number(total.input_tokens).toLocaleString()} in / ` +
                `${Number(total.output_tokens).toLocaleString()} out tokens, ` +
                `**$${Number(total.cost_usd).toFixed(4)}** total (${byProv}). ` +
                `Month-to-date totals: [USAGE.md](../blob/${context.payload.pull_request.head.ref}/mobile-qa-agent/USAGE.md).`;
            } catch (e) {
              costLine = `\n---\n_LLM cost summary not available for this run._`;
            }

            const body = (passed
              ? [
                  '### 🤖 AI test generator: unit tests pass',
                  '',
                  `Generated tests and verified \`./gradlew testDebugUnitTest\` after **${attempts}** AI fix attempt(s) (limit: ${max}).`,
                  'The bot committed the changes to this PR branch.',
                  '',
                  '_(UI tests are verified separately by the Android CI workflow on the bot\'s commit.)_',
                ]
              : [
                  `### 🤖 AI test generator: unit tests still failing after ${max} fix attempt(s)`,
                  '',
                  'The bot generated tests, ran `./gradlew testDebugUnitTest`, and asked the generator',
                  `to fix the failures **${attempts}** time(s). The suite is still red.`,
                  '',
                  'Per workflow policy, the bot committed the generated tests anyway so the AI\'s work-in-progress',
                  'is visible on this PR. Please review and finish the remaining failures manually, or iterate',
                  'on the agent prompts in `mobile-qa-agent/prompts/`.',
                  '',
                  '_(UI tests are verified separately by the Android CI workflow on the bot\'s commit.)_',
                ]
            ).join('\n') + costLine;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

name: AI Mobile QA Review

# End-to-end automated flow:
#   1. Claude reviews the PR diff and posts a review comment.
#   2. If Claude flagged any missing tests, OpenAI generates Kotlin test files.
#   3. We run ./gradlew testDebugUnitTest to verify the generated tests pass.
#   4. If they pass, the bot commits them directly to the PR's source branch
#      (no follow-up PR — the tests land in the same PR).
#   5. If they fail, the bot posts a comment explaining what went wrong and
#      does NOT commit anything.
#
# Loop prevention: this workflow skips itself when the latest commit was made
# by github-actions[bot] (i.e., our own auto-commit). Without this guard,
# every auto-commit would re-trigger the workflow and burn LLM tokens.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review-and-generate:
    name: Review + auto-generate + verify + commit
    runs-on: ubuntu-latest
    # Skip on bot's own commits so we don't recurse
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR's source branch (not the merge commit) so we
          # can push the bot's commit back to it.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mobile-qa-agent/requirements.txt

      - name: Install agent dependencies
        run: pip install -r mobile-qa-agent/requirements.txt

      # ----------------------------------------------------------------------
      # 1. Reviewer (Claude / OpenAI / Bedrock — picked via PROVIDER)
      # ----------------------------------------------------------------------
      - name: Run AI QA reviewer
        id: review
        working-directory: mobile-qa-agent
        env:
          PROVIDER:           ${{ vars.PROVIDER || 'anthropic' }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:    ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:       ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          AWS_ACCESS_KEY_ID:  ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:         ${{ vars.AWS_REGION || 'us-east-1' }}
          BEDROCK_MODEL_ID:   ${{ vars.BEDROCK_MODEL_ID || 'us.amazon.nova-pro-v1:0' }}
        run: |
          mkdir -p artifacts
          python main.py --save-findings artifacts/findings.json

          # Determine whether any test gaps were found.
          HAS=$(python -c "
          import json
          d = json.load(open('artifacts/findings.json'))
          gaps = (d.get('missing_unit_tests') or []) + (d.get('missing_ui_tests') or [])
          print('true' if gaps else 'false')
          ")
          echo "has-findings=$HAS" >> "$GITHUB_OUTPUT"
          echo "Findings present: $HAS"

      # ----------------------------------------------------------------------
      # 2. Generator (OpenAI) — only if Claude found gaps
      # ----------------------------------------------------------------------
      - name: Generate Kotlin test files
        if: steps.review.outputs.has-findings == 'true'
        working-directory: mobile-qa-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:   ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          python generate_tests.py \
            --findings-file artifacts/findings.json \
            --max 5

      - name: Show newly generated files
        if: steps.review.outputs.has-findings == 'true'
        run: |
          echo "=== Generated test files ==="
          git status --short -- android/app/src/test/ android/app/src/androidTest/ || true

      # ----------------------------------------------------------------------
      # 3. Verify the generated tests with gradle
      # ----------------------------------------------------------------------
      - name: Set up JDK 17
        if: steps.review.outputs.has-findings == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Gradle (for bootstrapping the wrapper)
        if: steps.review.outputs.has-findings == 'true'
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Bootstrap Gradle wrapper
        if: steps.review.outputs.has-findings == 'true'
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Run unit tests (verify generated unit-test code)
        if: steps.review.outputs.has-findings == 'true'
        id: unit_tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      # UI tests are NOT booted here — booting an emulator inside this workflow
      # would add ~5-10 min per PR. Instead we rely on android-ci.yml's
      # `instrumented-tests` job (which uses AVD caching) to verify the
      # generated UI tests on the bot's commit. If the UI test the AI wrote
      # turns out to be broken, you'll see a red Compose UI check on the
      # bot's commit and can revert it.

      # ----------------------------------------------------------------------
      # 4a. Commit if unit tests pass — UI tests are committed unverified
      # ----------------------------------------------------------------------
      - name: Commit generated tests to the PR branch
        if: |
          steps.review.outputs.has-findings == 'true' &&
          steps.unit_tests.outcome == 'success'
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"

          # Only stage the test directories — never production code
          git add -A android/app/src/test/ android/app/src/androidTest/

          if git diff --staged --quiet; then
            echo "No new test files to commit."
            exit 0
          fi

          git commit -m "🤖 AI-generated tests for missing coverage

          Generated by the AI Mobile QA Review workflow after Claude flagged
          missing test coverage. Verified locally on CI before committing."

          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      # ----------------------------------------------------------------------
      # 4b. If unit tests fail, comment on the PR and do NOT commit anything.
      #
      # We don't gate on UI tests here — they're verified by android-ci.yml
      # on the bot's commit. If a generated UI test is broken, you'll see a
      # red Compose UI check on the auto-commit and can revert it.
      # ----------------------------------------------------------------------
      - name: Comment on PR if generated unit tests fail
        if: |
          steps.review.outputs.has-findings == 'true' &&
          steps.unit_tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### 🤖 AI test generator: generated unit tests do not pass',
              '',
              'Claude flagged missing test coverage and OpenAI generated test',
              'files, but `./gradlew testDebugUnitTest` failed. The bot is **not**',
              'committing the generated tests.',
              '',
              'Check the workflow logs for the failing output, then either fix the',
              'generated code manually or iterate on the agent prompts in',
              '`mobile-qa-agent/prompts/`.',
              '',
              '(UI tests are verified separately by the Android CI workflow.)',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

name: Android CI

on:
  pull_request:
    # `labeled` is added so the instrumented job below fires when someone
    # applies the `run-instrumented` label after the PR is opened.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]

jobs:
  unit-tests:
    name: JUnit (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest

  instrumented-tests:
    name: Espresso / Compose UI (emulator)
    runs-on: ubuntu-latest
    # Opt-in via PR label or on push to main, to keep PR feedback fast.
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-instrumented') }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-report
          path: android/app/build/reports/androidTests/connected

name: AI Test Generator

# Triggered when someone comments `/generate-tests` on a PR.
# Reads the AI QA Agent's most recent review comment, calls OpenAI to write
# Kotlin test files for each flagged gap, and opens a follow-up PR.

on:
  issue_comment:
    types: [created]

jobs:
  generate:
    name: Generate tests from agent findings
    # Only react to /generate-tests on a PR (issue_comment fires on both)
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/generate-tests')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: React 👀 to the trigger comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - uses: actions/checkout@v4
        with:
          # We'll do our own commits inside generate_tests.py, but checkout
          # main first so the script can `git fetch` the PR branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mobile-qa-agent/requirements.txt

      - name: Install agent deps
        run: pip install -r mobile-qa-agent/requirements.txt

      - name: Run generator
        working-directory: mobile-qa-agent
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:   ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: python generate_tests.py

      - name: React 🚀 on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: React 👎 on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1',
            });
